<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nightfall</title>

<link rel="manifest" href="manifest.json">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#07060d;
    font-family:"Trebuchet MS", sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; color:#fff;
  }
  canvas { display:block; }

  #menu {
    position:fixed; inset:0; overflow-y:auto; padding:26px 18px 60px;
    background:linear-gradient(#0d0a18, #1c1226 55%, #2d1420);
    touch-action:pan-y;
  }
  #menu h1 { font-size:42px; text-align:center; letter-spacing:3px;
    text-shadow:0 0 26px rgba(255,140,60,.55); }
  #menu .sub { text-align:center; opacity:.6; font-size:13px; margin-bottom:6px; }
  #menu .ver { text-align:center; opacity:.32; font-size:11px;
               letter-spacing:1px; margin-bottom:22px; }

  .panel {
    background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.12);
    border-radius:14px; padding:14px; margin-bottom:18px;
  }
  .panel h3 { font-size:15px; margin-bottom:6px; }
  .panel p { font-size:12px; opacity:.62; line-height:1.55; margin-bottom:9px; }
  .panel ul { font-size:12.5px; opacity:.75; line-height:1.75; padding-left:18px; }
  textarea {
    width:100%; height:120px; padding:10px; border-radius:9px;
    background:rgba(0,0,0,.45); color:#fff; font-size:13px;
    border:1px solid rgba(255,255,255,.18);
    font-family:"Courier New", monospace; resize:vertical;
    -webkit-user-select:text; user-select:text; touch-action:auto;
  }
  .btnrow { display:flex; gap:8px; margin-top:9px; flex-wrap:wrap; }

  .deck {
    display:flex; align-items:center; gap:10px;
    padding:11px 12px; border-radius:11px; margin-bottom:8px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
  }
  .deck.on {
    background:rgba(255,157,77,.16);
    border-color:rgba(255,157,77,.6);
    box-shadow:0 0 14px rgba(255,140,60,.18);
  }
  .deck .dinfo { flex:1; min-width:0; }
  .deck .dname { font-size:14px; font-weight:bold;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deck.on .dname::before { content:"● "; color:#ff9d4d; font-size:11px; }
  .deck .dmeta { font-size:11.5px; opacity:.55; margin-top:2px; }
  .deck .dacts { display:flex; gap:6px; flex-shrink:0; }
  .dbtn {
    padding:6px 11px; border-radius:16px; font-size:11.5px;
    background:rgba(255,255,255,.12); color:#fff; border:none;
  }

  #deckname {
    width:100%; padding:10px; border-radius:9px; margin-bottom:9px;
    background:rgba(0,0,0,.45); color:#fff; font-size:14px;
    border:1px solid rgba(255,255,255,.18);
    -webkit-user-select:text; user-select:text;
  }
  #editor:not(:empty) {
    margin-top:14px; padding-top:14px;
    border-top:1px solid rgba(255,255,255,.12);
  }
  .btn { padding:10px 18px; border-radius:22px; font-size:13px; font-weight:bold;
    background:#ff9d4d; color:#2b1a0c; border:none; }
  .btn.ghost { background:rgba(255,255,255,.14); color:#fff; }
  #loadmsg { font-size:12px; margin-top:9px; min-height:16px; }
  #play { display:block; width:100%; padding:17px; font-size:19px; font-weight:bold;
    border:none; border-radius:30px; background:#ff9d4d; color:#2b1a0c; margin-top:6px; }
  #recordline { text-align:center; font-size:13px; opacity:.7; margin-top:12px; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; display:none; pointer-events:none; }
  #clock { position:absolute; top:14px; right:64px; font-size:16px;
    font-variant-numeric:tabular-nums; text-shadow:0 2px 10px #000; }
  #clock .day { font-weight:bold; }
  #clock .sep { opacity:.4; margin:0 7px; }
  #clock .time { opacity:.75; }

  #infobtn {
    position:absolute; top:7px; right:12px;
    width:34px; height:34px; border-radius:50%;
    background:rgba(200,164,255,.15);
    border:1px solid rgba(201,164,255,.45);
    display:flex; align-items:center; justify-content:center;

  }
  #infobtn svg { width:20px; height:20px; display:block; }
  #infopanel {

  #infopanel .prow {

  #infopanel .icost { float:right; color:#ffd257; font-weight:normal; font-size:13px; }
  #infocoins { font-size:14px; color:#ffd257; font-weight:bold; margin-bottom:16px; }

  #dawnbar { position:absolute; top:86px; left:16px; width:136px; height:11px;

  #dawnfill { height:100%; width:0%; background:linear-gradient(90deg,#7cc6ff,#ffe9a8); }
  #dawnlabel { position:absolute; top:100px; left:16px; font-size:11px; opacity:.65; }

  #woodline { position:absolute; top:122px; left:16px; font-size:14px; font-weight:bold; }
  #warn { position:absolute; top:40%; left:0; right:0; text-align:center;

  #banner { position:absolute; top:32%; left:0; right:0; text-align:center;

  #stickzone { position:fixed; left:0; bottom:0; width:46%; height:45%; display:none; }
  #stick { position:absolute; left:30px; bottom:40px; width:140px; height:140px;

  #study {
    position:fixed; right:26px; bottom:170px; display:none;

  /* only lights up when you're standing at the fire with wood */
  #strikebtn {

    background:rgba(255,120,120,.18); border:2px solid rgba(255,150,150,.8);

  #strikebtn.cooling { opacity:.34; border-color:rgba(255,150,150,.3); }
  #strikebtn.ready {
    background:rgba(255,90,90,.42);
    border-color:#ff8a8a;

  #feedbtn {

  .power {

  #leaveshop {

  .opt.right { background:rgba(110,231,183,.28); border-color:#6ee7b7; }
  .opt.wrong { background:rgba(255,110,100,.25); border-color:#ff7a6e; }
  #qresult { font-size:15px; margin-top:8px; min-height:22px; }

  #choice { display:none; margin-top:16px; }
  #choice .ctitle { font-size:14px; opacity:.8; margin-bottom:10px; }
  .cbtn { display:block; width:100%; padding:15px; margin-bottom:10px; border-radius:13px;
    font-size:15px; font-weight:bold; color:#fff; text-align:left; }
  #feed { background:rgba(255,140,60,.22); border:2px solid rgba(255,157,77,.85); }
  #toward { background:rgba(124,198,255,.18); border:2px solid rgba(124,198,255,.8); }
  .cbtn small { display:block; font-weight:normal; font-size:12px; opacity:.75; margin-top:3px; }

  /* ---------- END ---------- */
  #over { position:fixed; inset:0; display:none; z-index:15; flex-direction:column;
    align-items:center; justify-content:flex-start; text-align:center; padding:32px 20px;
    background:rgba(10,6,14,.94); overflow-y:auto; touch-action:pan-y; }
  #over h2 { font-size:32px; margin-bottom:8px; color:#ff8a7a; }
  #over .stat { font-size:15px; opacity:.85; margin:3px 0; }
  #over .bigstat { font-size:40px; font-weight:bold; margin:12px 0 4px; }
  #review { width:100%; max-width:520px; margin:22px 0; text-align:left; }
  #review h3 { font-size:15px; margin-bottom:10px; opacity:.85; }
  .miss { background:rgba(255,110,100,.1); border-left:3px solid #ff7a6e;
    border-radius:7px; padding:11px 13px; margin-bottom:9px; }
  .miss .mq { font-size:14px; margin-bottom:5px; }
  .miss .ma { font-size:13px; color:#8ee7b7; }
</style>

<body>

<div id="menu"></div>

<div id="hud">
  <div id="hearts"></div>
  <div id="firebar"><div id="firefill"></div></div>
  <div id="firelabel">campfire</div>
  <div id="dawnbar"><div id="dawnfill"></div></div>
  <div id="dawnlabel">until dawn</div>
  <div id="woodline">wood: 0</div>
  <div id="coinline">0 coins</div>
  <div id="buffline"></div>
  <div id="clock">0:00</div>
  <div id="infobtn"><svg viewBox="0 0 24 24" fill="none">
    <path d="M12 2 L6 17 L18 17 Z" fill="#b78cff" stroke="#d9c2ff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M4 17.6 h16 a1 1 0 0 1 0 3 H4 a1 1 0 0 1 0-3 Z" fill="#8f63e0" stroke="#d9c2ff" stroke-width="1.1"/>
    <circle cx="12.6" cy="11" r="1.05" fill="#ffe27a"/>
    <circle cx="10.4" cy="14.2" r=".75" fill="#ffe27a"/>
  </svg></div>
  <div id="phase">Night 1</div>
  <div id="warn"></div>

</div>

<div id="stickzone"><div id="stick"><div id="knob"></div></div></div>
<div id="strikebtn">STRIKE</div>
<div id="study">STUDY</div>
<div id="feedbtn"><span id="feednum">0</span><span>FEED</span></div>

<div id="infopanel">
  <h2>The Wanderer's gifts</h2>
  <div class="isub">cut monsters down for coins, then spend them when he turns up</div>
  <div id="infocoins"></div>
  <div id="infolist"></div>
  <button id="infoclose">back to the night</button>
</div>

  <h2>the wanderer</h2>
  <div class="line" id="wizline">"take one. the night is long."</div>

    <div class="ctitle">spend it how?</div>

      <small>+40 fuel — buys you time tonight</small></button>

      <small>+1 progress — gets the night over with</small></button>

  <button class="btn" id="qcont" style="display:none">back to it</button>

  <h2 id="overtitle">the dark got you</h2>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// #####################################################
//  NIGHTFALL
//  Answer questions to reach dawn. Every right answer
//  is a choice: keep the fire alive, or push toward
//  morning. One answer can't do both.
// #####################################################


// =====================================================
//  QUESTION BANK
// =====================================================
const SAMPLE_TEXT =
`What is the powerhouse of the cell?
*Mitochondria
Nucleus
Ribosome
Golgi body

What is the greatest common factor of 12 and 18?
*6
3
9
12

What is 3/4 + 1/8?
*7/8
4/12
1/2
5/8

Which planet has the most moons?
*Saturn
Jupiter
Neptune
Mars

What year did the Berlin Wall fall?
*1989
1975
1991
1968

Factor completely: x² - 9
*(x+3)(x-3)
(x-3)(x-3)
(x+9)(x-1)
x(x-9)

What gas do plants absorb for photosynthesis?
*Carbon dioxide
Oxygen
Nitrogen
Hydrogen

Who was the first president of the United States?
*George Washington
Thomas Jefferson
John Adams
Benjamin Franklin

Simplify: 4/6
*2/3
3/4
1/2
4/3

What is the largest organ in the human body?
*Skin
Liver
Lungs
Heart`;

let questions = [], queue = [], qAsked = 0, qRight = 0;
let missed = [];

function parseQuestions(text){
  const blocks = text.trim().split(/\n\s*\n/);
  const out = [];
  for (const block of blocks){
    const lines = block.split("\n").map(l => l.trim()).filter(l => l.length);
    if (lines.length < 3) continue;
    const q = lines[0], options = [];
    let correct = -1;
    for (let i = 1; i < lines.length; i++){
      let line = lines[i];
      if (line.startsWith("*")){ correct = options.length; line = line.slice(1).trim(); }
      options.push(line);
    }
    if (correct === -1) continue;
    out.push({ q, options, correct });
  }
  return out;
}
function loadQuestions(text){
  const parsed = parseQuestions(text);
  if (!parsed.length) return 0;
  questions = parsed; queue = [];
  return parsed.length;
}
function shuffleQueue(){
  queue = questions.slice();
  for (let i = queue.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
}
function nextQuestion(){
  if (!queue.length) shuffleQueue();
  return queue.pop();
}
// SPACED REPETITION: missed questions come back soon
// instead of vanishing until the deck reshuffles.
function requeueSoon(q){
  const pos = Math.max(0, queue.length - 3);
  queue.splice(pos, 0, q);
}
// =====================================================
//  QUESTION SETS — saved decks, one per subject
//
//  localStorage only holds text, so a whole list of decks
//  has to be turned into a string with JSON.stringify on
//  the way in and JSON.parse on the way out.
// =====================================================
const SAVE_DECKS = "nightfall.decks";
const SAVE_ACTIVE = "nightfall.active";

function save(key, value){
  try { localStorage.setItem(key, value); } catch(e) {}
}
function load(key){
  try { return localStorage.getItem(key); } catch(e) { return null; }
}

let decks = [];
let activeDeck = 0;

function saveDecks(){
  save(SAVE_DECKS, JSON.stringify(decks));
  save(SAVE_ACTIVE, activeDeck);
}

function initDecks(){
  try {
    const raw = load(SAVE_DECKS);
    if (raw) decks = JSON.parse(raw);
  } catch(e) { decks = []; }
  if (!Array.isArray(decks)) decks = [];

  // anything saved under the old single-set system moves over
  const old = load("nightfall.questions");
  if (!decks.length && old && parseQuestions(old).length){
    decks.push({ name: "My questions", text: old, best: 1 });
    saveDecks();
  }

  if (!decks.length){
    decks.push({ name: "Sample set", text: SAMPLE_TEXT, best: 1 });
  }

  activeDeck = Number(load(SAVE_ACTIVE)) || 0;
  if (activeDeck < 0 || activeDeck >= decks.length) activeDeck = 0;
  if (!loadQuestions(decks[activeDeck].text)) loadQuestions(SAMPLE_TEXT);
}
initDecks();

// which set the editor is open on: null = closed, -1 = brand new
let editing = null;


// =====================================================
//  BALANCE — every knob in one place
// =====================================================
const ARENA = 42;

const FIRE_MAX = 100;
// fuel lost per millisecond. 0.0011 x 1000ms x 91s ≈ 100,
// so a full fire lasts about a minute and a half.
const FIRE_BURN = 0.0011;
const FIRE_BURN_STUDYING = 1.8;
const FIRE_BURN_DAWN = 0.12;
const WOOD_VALUE = 25;
const ANSWER_FUEL = 40;
const FIRE_RADIUS_MAX = 13;

const PLAYER_SPEED = 0.175;
const MAX_HEALTH = 3;
const HURT_COOLDOWN = 1200;

const ENEMY_SPEED_BASE = 0.045;
const ENEMY_SPEED_GROWTH = 0.008;

const DAWN_DURATION = 38000;
const dawnGoalFor = n => 4 + n;     // night 1 needs 5, night 2 needs 6...

// the wanderer — shows up once, every 3 to 5 nights
const WIZ_NIGHT_MIN = 3;
const WIZ_NIGHT_MAX = 5;
const WIZ_EARLIEST = 12000;         // soonest into a night he'll appear
const WIZ_LATEST = 40000;
const WIZ_STAY = 30000;             // how long he waits before leaving

// each set keeps its own record
let bestNight = (decks[activeDeck] && decks[activeDeck].best) || 1;


// =====================================================
//  THREE.JS SETUP
// =====================================================
const NIGHT_SKY = new THREE.Color(0x080711);
const DAWN_SKY  = new THREE.Color(0x6b7fa8);

const scene = new THREE.Scene();
scene.background = NIGHT_SKY.clone();
scene.fog = new THREE.Fog(NIGHT_SKY.clone(), 12, 46);

function updateSafeRing(t){
  const r = fireRadius();
  if (r < .5){ safeRing.visible = false; safeFill.visible = false; return; }
  safeRing.visible = true; safeFill.visible = true;
  safeRing.scale.set(r, r, 1);
  safeFill.scale.set(r, r, 1);
  // pulse gently, and fade as the fire dies
  const life = fuel/FIRE_MAX;
  safeRing.material.opacity = (.34 + life*.3) + Math.sin(t*.004)*.07;
  safeFill.material.opacity = .06 + life*.1;
}

// sword state
let swordTier = 0;
let swingTimer = 0;     // counts down through the swing animation
let swingCooldown = 0;  // gap between strikes, so a swarm still wins
let swingLive = 0;      // blade is still dangerous mid-arc
const SWING_TIME = 260;
let kills = 0;
let coins = 0;

function applySwordLook(){
  const s = SWORDS[swordTier];
  blade.material.color.setHex(s.color);
  swordGlow.color.setHex(s.glow);
  swordGlow.intensity = .6 + swordTier*.22;
}

// ---- swinging the blade ----
// A swing catches everything inside your reach at once, so
// getting surrounded isn't automatically a death sentence —
// but the cooldown means you can't just mash it.
function strike(){
  if (!playing || studying || swingCooldown > 0) return;

  swingTimer = SWING_TIME;
  swingCooldown = SWORDS[swordTier].gap;
  strikeBtn.classList.add("cooling");

  const reach = SWORDS[swordTier].reach;
  let hit = 0;
  for (let i = enemies.length-1; i >= 0; i--){
    const e = enemies[i];
    if (e.fleeing) continue;
    if (Math.hypot(player.x - e.x, player.z - e.z) < reach){
      scene.remove(e.mesh);
      enemies.splice(i,1);
      hit++;
    }
  }

  if (hit > 0){
    kills += hit;
    // later nights pay better — night 1 gives 1 each, night 5 gives 3
    coins += hit * (1 + Math.floor((nightNumber-1)/2));
    if (hit > 1) warn(hit + " at once!");
    updateHUD();
  }
  // the blade stays live for the length of the swing, so anything
  // that walks into the arc still gets caught
  swingLive = SWING_TIME;
}

let woodItems = [], woodHeld = 0, enemies = [];

function spawnWood(){
  let x, z, d;
  do {
    x = (Math.random()*2-1)*(ARENA-6);
    z = (Math.random()*2-1)*(ARENA-6);
    d = Math.hypot(x,z);
  } while (d < 7);

  const mesh = boxMesh(1.1,.32,.32,0x7a5030);
  mesh.position.set(x,.26,z);
  mesh.rotation.y = Math.random()*Math.PI;
  scene.add(mesh);
  const glow = new THREE.PointLight(0xffcf8a,.5,4.5,2);
  glow.position.set(x,.7,z);
  scene.add(glow);
  woodItems.push({ mesh, glow, x, z });
}

function spawnEnemy(){
  const a = Math.random()*Math.PI*2, d = ARENA-4;
  const x = Math.cos(a)*d, z = Math.sin(a)*d;
  const g = new THREE.Group();

  // Cold pale teal against the warm orange firelight — opposite
  // sides of the colour wheel, so they stand out at any distance.
  // emissive means they glow a little on their own instead of
  // vanishing the moment they step outside the fire's reach.
  const bodyMat = new THREE.MeshLambertMaterial({
    color:0x63c4c0, emissive:0x1d4a48
  });
  const headMat = new THREE.MeshLambertMaterial({
    color:0x8fe3dd, emissive:0x2a5f5c
  });

  const body = new THREE.Mesh(new THREE.BoxGeometry(.62,1.15,.45), bodyMat);
  body.position.y=.58; g.add(body);
  const h = new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5), headMat);
  h.position.y=1.42; g.add(h);

  const eyeMat = new THREE.MeshBasicMaterial({ color:0xff2d2d });
  const e1 = new THREE.Mesh(new THREE.BoxGeometry(.12,.1,.06), eyeMat);
  const e2 = new THREE.Mesh(new THREE.BoxGeometry(.12,.1,.06), eyeMat);
  e1.position.set(-.12,1.45,.26); e2.position.set(.12,1.45,.26);
  g.add(e1,e2);

  g.position.set(x,0,z);
  scene.add(g);
  enemies.push({ mesh:g, x, z, bob:Math.random()*6, fleeing:false });
}

function clearEnemies(){ for (const e of enemies) scene.remove(e.mesh); enemies = []; }
function clearWood(){ for (const w of woodItems){ scene.remove(w.mesh); scene.remove(w.glow); } woodItems = []; }

let wizActive = false, wizTimer = 0;
let wizX = 0, wizZ = 0;
let wizNextNight = 3;        // which night he'll next turn up on
let wizPending = false;      // he's due tonight and hasn't shown yet
let wizAppearIn = 0;         // countdown until he walks out of the trees
let wizDoneTonight = false;

// Called at the start of every night. Decides whether he's
// coming tonight, and if so, roughly when.
function scheduleWizard(){
  wizDoneTonight = false;
  if (nightNumber >= wizNextNight){
    wizPending = true;
    wizAppearIn = WIZ_EARLIEST + Math.random()*(WIZ_LATEST - WIZ_EARLIEST);
  } else {
    wizPending = false;
  }
}

function rollNextWizardNight(){
  const gap = WIZ_NIGHT_MIN + Math.floor(Math.random()*(WIZ_NIGHT_MAX - WIZ_NIGHT_MIN + 1));
  wizNextNight = nightNumber + gap;
}

function spawnWizard(){
  const a = Math.random()*Math.PI*2;
  const r = 11 + Math.random()*13;
  wizX = Math.cos(a)*r;
  wizZ = Math.sin(a)*r;
  wizard.position.set(wizX, 0, wizZ);
  wizard.visible = true;
  wizActive = true;
  wizPending = false;
  wizTimer = WIZ_STAY;
  banner("a stranger", "#c9a4ff");
}

function despawnWizard(){
  wizActive = false;
  wizard.visible = false;
  wizLight.intensity = 0;
}

// sword upgrades are permanent, so they cost real money
const SWORD_COSTS = [18, 40, 75];

function swordOffer(){
  if (swordTier >= SWORDS.length - 1) return null;
  const next = SWORDS[swordTier + 1];
  return {
    name: next.name,
    cost: SWORD_COSTS[swordTier],
    desc: "a better blade — longer reach, faster swing. yours for good",
    apply(){ swordTier++; applySwordLook(); buffNote(next.name.toLowerCase()); }
  };
}

let burnMultiplier = 1;
let doubleAnswers = 0;
let wardTimer = 0;
let longDawn = false;
let maxHealth = MAX_HEALTH;
let activeBuffs = [];

function buffNote(text){
  activeBuffs.push(text);
  if (activeBuffs.length > 4) activeBuffs.shift();
  document.getElementById("buffline").innerHTML = activeBuffs.join("<br>");
}

// what's already been bought this visit
let boughtThisVisit = [];

function openWizard(){
  studying = true;             // reuse the pause flag
  stickReset();
  boughtThisVisit = [];
  renderShop();
  document.getElementById("wizpick").style.display = "flex";
}

function renderShop(){
  const holder = document.getElementById("wizopts");
  holder.innerHTML = "";

  document.getElementById("wizline").innerHTML =
    '"spend it or carry it. the night doesn\'t care."' +
    '<div id="purse">you have <b>' + coins + '</b> coin' + (coins===1?"":"s") + '</div>';

  const stock = POWERS.slice();
  const s = swordOffer();
  if (s) stock.unshift(s);      // the blade sits at the top

  stock.forEach(p => {
    const sold = boughtThisVisit.includes(p.name);
    const canAfford = coins >= p.cost;

    const btn = document.createElement("button");
    btn.className = "power" + ((sold || !canAfford) ? " locked" : "");
    btn.innerHTML =
      '<span class="pcost">' + p.cost + '</span>' +
      p.name + "<small>" + (sold ? "already bought tonight" : p.desc) + "</small>";

    btn.onclick = () => {
      if (sold || !canAfford) return;
      coins -= p.cost;
      p.apply();
      if (p.once) boughtThisVisit.push(p.name);
      updateHUD();
      renderShop();             // redraw with the new balance
    };
    holder.appendChild(btn);
  });

  const leave = document.createElement("button");
  leave.id = "leaveshop";
  leave.textContent = coins > 0 ? "keep the rest — back to the night" : "back to the night";
  leave.onclick = () => {
    document.getElementById("wizpick").style.display = "none";
    studying = false;
    despawnWizard();
    wizDoneTonight = true;
    rollNextWizardNight();
  };
  holder.appendChild(leave);
}

function updateWizard(dt, t){
  if (!wizActive){
    // he only walks out during the night, and only if he's due
    if (phase === "night" && wizPending && !wizDoneTonight){
      wizAppearIn -= dt;
      if (wizAppearIn <= 0) spawnWizard();
    }
    return;
  }

  wizTimer -= dt;
  if (wizTimer <= 0){
    // missed him — he won't be back for a few nights either way
    despawnWizard();
    wizDoneTonight = true;
    rollNextWizardNight();
    return;
  }

  wizard.position.y = Math.sin(t*.002)*.12;
  wizard.rotation.y = Math.atan2(player.x - wizX, player.z - wizZ);
  wizard.userData.orb.rotation.y += .05;
  wizLight.position.set(wizX, 2.4, wizZ);
  wizLight.intensity = 1.5 + Math.sin(t*.005)*.5;

  if (wizTimer < 5000) wizLight.intensity *= (wizTimer/5000);

  if (Math.hypot(player.x - wizX, player.z - wizZ) < 2.4){
    openWizard();
  }
}

let playing = false, studying = false;

let elapsed = 0, lastFrame = 0;

function fireRadius(){ return (fuel/FIRE_MAX)*FIRE_RADIUS_MAX; }

function resetGame(){
  clearEnemies(); clearWood();
  player.x=0; player.z=6; player.facing=0;
  maxHealth = MAX_HEALTH;
  player.health=maxHealth; player.hurtTimer=0;
  fuel = FIRE_MAX; woodHeld = 0;
  elapsed = 0; spawnTimer = 0; woodTimer = 0;
  nightNumber = 1; dawnGoal = dawnGoalFor(1); dawnProgress = 0;
  phase = "night"; skyBlend = 0; dawnTimer = 0;
  qAsked = 0; qRight = 0; missed = [];
  burnMultiplier = 1; doubleAnswers = 0; wardTimer = 0; longDawn = false;
  swordTier = 0; applySwordLook(); swingTimer = 0; swingCooldown = 0; swingLive = 0;
  kills = 0; coins = 0;
  activeBuffs = []; document.getElementById("buffline").innerHTML = "";
  despawnWizard();
  // first visit lands on night 3, 4, or 5
  nightNumber = 1;
  wizNextNight = WIZ_NIGHT_MIN + Math.floor(Math.random()*(WIZ_NIGHT_MAX - WIZ_NIGHT_MIN + 1));
  scheduleWizard();
  shuffleQueue();
  for (let i = 0; i < 6; i++) spawnWood();
  updateHUD();
}

//  HUD

function formatTime(ms){
  const t = ms/1000, m = Math.floor(t/60), s = Math.floor(t%60);
  return m + ":" + String(s).padStart(2,"0");
}

function updateHUD(){
  let hearts = "";
  for (let i=0;i<maxHealth;i++) hearts += i < player.health ? "♥ " : "♡ ";
  document.getElementById("hearts").textContent = hearts;

  document.getElementById("firefill").style.width = Math.max(0,(fuel/FIRE_MAX)*100) + "%";
  document.getElementById("woodline").textContent = "wood: " + woodHeld;
  document.getElementById("coinline").textContent = coins + " coin" + (coins===1?"":"s");

  document.getElementById("clock").innerHTML =
    '<span class="day">Day ' + nightNumber + '</span>' +
    '<span class="sep">·</span>' +
    '<span class="time">' + formatTime(elapsed) + '</span>';

  if (phase === "night"){
    document.getElementById("phase").textContent = "Night";
    document.getElementById("dawnfill").style.width = (dawnProgress/dawnGoal)*100 + "%";
    document.getElementById("dawnlabel").textContent =
      "until dawn: " + dawnProgress + " / " + dawnGoal;
  } else {
    document.getElementById("phase").textContent = "Dawn";
    document.getElementById("dawnfill").style.width = (dawnTimer/DAWN_DURATION)*100 + "%";
    document.getElementById("dawnlabel").textContent =
      "daylight left: " + Math.max(0, Math.ceil(dawnTimer/1000)) + "s";
  }
}

const input = { x:0, z:0 };
const zoneEl = document.getElementById("stickzone");
const stickEl = document.getElementById("stick");
const knobEl = document.getElementById("knob");

const MAX = 42, DEADZONE = .18;

function stickAt(cx,cy){
  const zr = zoneEl.getBoundingClientRect();
  stickEl.style.left = (cx - zr.left - 70) + "px";
  stickEl.style.bottom = (innerHeight - cy - 70) + "px";
}
function stickUpdate(cx,cy){
  const r = stickEl.getBoundingClientRect();
  let dx = cx-(r.left+r.width/2), dy = cy-(r.top+r.height/2);
  const d = Math.hypot(dx,dy);
  if (d > MAX){ dx = dx/d*MAX; dy = dy/d*MAX; }
  knobEl.style.left = (42+dx)+"px"; knobEl.style.top = (42+dy)+"px";
  input.x = dx/MAX; input.z = dy/MAX;
}
function stickReset(){
  stickId=null; input.x=0; input.z=0;
  knobEl.style.left="42px"; knobEl.style.top="42px";
  stickEl.style.left="30px"; stickEl.style.bottom="40px";
}

function readKeyboard(){

  if (keys["d"]||keys["arrowright"]) kx+=1;
  if (keys["w"]||keys["arrowup"]) kz-=1;

let camAngle=0, dragId=null, dragLastX=0, dragDist=0;

let currentQ = null, answered = false, displayOrder = [];

function openQuiz(){
  if (!playing || studying || !questions.length) return;
  currentQ = nextQuestion();
  answered = false;
  studying = true;
  stickReset();

  document.getElementById("qwarn").textContent =
    phase === "night" ? "the fire keeps burning while you think"
                      : "daylight is passing while you think";
  document.getElementById("qtext").textContent = currentQ.q;
  document.getElementById("qresult").textContent = "";
  document.getElementById("choice").style.display = "none";
  document.getElementById("qcont").style.display = "none";

  // ---------------------------------------------------
  // Shuffle where the options appear on screen.
  // displayOrder holds the ORIGINAL positions in a new
  // random order, so we can still tell which one was
  // marked correct in the question file.
  // ---------------------------------------------------
  displayOrder = currentQ.options.map((_, i) => i);
  for (let i = displayOrder.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [displayOrder[i], displayOrder[j]] = [displayOrder[j], displayOrder[i]];
  }

  const holder = document.getElementById("qopts");
  holder.innerHTML = "";
  displayOrder.forEach(originalIndex => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = currentQ.options[originalIndex];
    b.onclick = () => answerQ(originalIndex, b);
    holder.appendChild(b);
  });

  document.getElementById("quiz").style.display = "flex";
}

function answerQ(index, btn){
  if (answered) return;
  answered = true;
  qAsked++;

  const opts = document.querySelectorAll("#qopts .opt");
  // the right answer is now somewhere else on screen,
  // so look up where it ended up before highlighting it
  const correctSlot = displayOrder.indexOf(currentQ.correct);
  if (opts[correctSlot]) opts[correctSlot].classList.add("right");

  if (index === currentQ.correct){
    qRight++;
    document.getElementById("qresult").textContent = "correct";

    // During dawn there's no dawn to reach, so the second
    // option becomes something useful for the day instead.
    const towardBtn = document.getElementById("toward");
    if (phase === "dawn"){
      towardBtn.innerHTML = "gather kindling" +
        "<small>+2 wood — stock up before dark</small>";
    } else {
      towardBtn.innerHTML = "count toward dawn" +
        "<small>+1 progress — gets the night over with</small>";
    }

    document.getElementById("choice").style.display = "block";
  } else {
    btn.classList.add("wrong");
    document.getElementById("qresult").textContent = "wrong — it'll come back around";
    requeueSoon(currentQ);
    if (!missed.some(m => m.q === currentQ.q)) missed.push(currentQ);
    document.getElementById("qcont").style.display = "inline-block";
  }
}

function closeQuiz(){
  document.getElementById("quiz").style.display = "none";
  studying = false;
}

document.getElementById("qcont").onclick = closeQuiz;

document.getElementById("feed").onclick = () => {
  const mult = doubleAnswers > 0 ? 2 : 1;
  if (doubleAnswers > 0) doubleAnswers--;
  fuel = Math.min(FIRE_MAX, fuel + ANSWER_FUEL * mult);
  updateHUD();
  closeQuiz();
  warn(mult === 2 ? "the fire blazes" : "the fire roars up");
};

document.getElementById("toward").onclick = () => {
  const mult = doubleAnswers > 0 ? 2 : 1;
  if (doubleAnswers > 0) doubleAnswers--;

  if (phase === "dawn"){
    // daylight: no dawn to work toward, so take wood instead
    woodHeld += 2 * mult;
    updateHUD();
    closeQuiz();
    warn("+" + (2*mult) + " wood");
    return;
  }

  dawnProgress += mult;
  updateHUD();
  closeQuiz();
  if (dawnProgress >= dawnGoal) startDawn();
  else warn(dawnProgress + " / " + dawnGoal + " to dawn");
};

// =====================================================
//  DAY / NIGHT CYCLE
// =====================================================
function startDawn(){
  if (phase === "dawn") return;   // already morning — don't restart it
  phase = "dawn";
  dawnTimer = longDawn ? DAWN_DURATION * 2 : DAWN_DURATION;
  longDawn = false;
  banner("DAWN", "#ffe9a8");
  for (const e of enemies) e.fleeing = true;
  despawnWizard();
  for (let i = 0; i < 8; i++) spawnWood();
  updateHUD();
}

function startNight(){
  phase = "night";
  nightNumber++;
  dawnGoal = dawnGoalFor(nightNumber);
  dawnProgress = 0;
  clearEnemies();
  // Steady Flame and the blade only last the night you got them
  burnMultiplier = 1;
  wardTimer = 0;
  swingTimer = 0; swingCooldown = 0; swingLive = 0;
  activeBuffs = [];
  document.getElementById("buffline").innerHTML = "";
  scheduleWizard();
  if (nightNumber > bestNight){ bestNight = nightNumber; decks[activeDeck].best = bestNight; saveDecks(); }
  banner("NIGHT " + nightNumber, "#ff8a7a");
  updateHUD();
}


// =====================================================
//  SIMULATION
// =====================================================
function updatePlayer(dt){
  readKeyboard();

  const fx=Math.sin(camAngle), fz=Math.cos(camAngle);
  const rx=-Math.cos(camAngle), rz=Math.sin(camAngle);
  let mx = input.x*rx + (-input.z)*fx;
  let mz = input.x*rz + (-input.z)*fz;
  let mag = Math.hypot(mx,mz);
  if (mag>1){ mx/=mag; mz/=mag; mag=1; }
  const moving = mag > DEADZONE;

  if (moving){
    player.x += mx*PLAYER_SPEED;
    player.z += mz*PLAYER_SPEED;
    const want = Math.atan2(mx,mz);
    let diff = want - player.facing;
    while (diff>Math.PI) diff -= Math.PI*2;
    while (diff<-Math.PI) diff += Math.PI*2;
    player.facing += diff*.25;
  }

  player.x = Math.max(-ARENA+3, Math.min(ARENA-3, player.x));
  player.z = Math.max(-ARENA+3, Math.min(ARENA-3, player.z));

  if (Math.hypot(player.x, player.z) < 2.1){
    const a = Math.atan2(player.z, player.x);
    player.x = Math.cos(a)*2.1;
    player.z = Math.sin(a)*2.1;
  }

  if (moving) player.walkCycle += .27;
  else player.walkCycle *= .85;
  const swing = Math.sin(player.walkCycle)*.8;
  legL.rotation.x=swing; legR.rotation.x=-swing;
  armL.rotation.x=-swing*.75; armR.rotation.x=swing*.75;

  person.position.set(player.x, 0, player.z);
  person.rotation.y = player.facing;

  if (player.hurtTimer > 0){
    player.hurtTimer -= dt;
    person.visible = Math.floor(player.hurtTimer/90) % 2 === 0;
  } else person.visible = true;
}

function nearFire(){
  return Math.hypot(player.x, player.z) < 3.6;
}

function updateWood(){
  for (let i = woodItems.length-1; i >= 0; i--){
    const w = woodItems[i];
    w.mesh.rotation.y += .006;
    if (Math.hypot(w.x-player.x, w.z-player.z) < 1.4){
      scene.remove(w.mesh); scene.remove(w.glow);
      woodItems.splice(i,1);
      woodHeld++;
      updateHUD();
    }
  }

  // the FEED button lights up only when it would do something
  const ready = nearFire() && woodHeld > 0 && fuel < FIRE_MAX;
  document.getElementById("feedbtn").classList.toggle("ready", ready);
  document.getElementById("feednum").textContent = woodHeld;
}

// one log per press — you decide how much to burn and when
function feedOneLog(){
  if (!playing || studying) return;
  if (!nearFire()){ warn("get closer to the fire"); return; }
  if (woodHeld <= 0){ warn("no wood"); return; }
  if (fuel >= FIRE_MAX){ warn("fire is already full"); return; }
  woodHeld--;
  fuel = Math.min(FIRE_MAX, fuel + WOOD_VALUE);
  updateHUD();
}

function updateFire(dt, t){
  // reading the powers list is a real pause — the fire waits for you
  if (infoOpen) return;

  let rate = FIRE_BURN * burnMultiplier;
  if (phase === "dawn") rate *= FIRE_BURN_DAWN;
  if (studying) rate *= FIRE_BURN_STUDYING;
  fuel = Math.max(0, fuel - rate*dt);

  const ratio = fuel/FIRE_MAX;
  const flick = .85 + Math.sin(t*.02)*.08 + Math.random()*.09;
  flame.scale.set(.4+ratio*.9, (.35+ratio)*flick, .4+ratio*.9);
  flame.material.color.setHex(ratio > .35 ? 0xff8a30 : 0x8a3a18);
  fireLight.intensity = (.25 + ratio*2.6)*flick;
  fireLight.distance = 8 + ratio*26;
}

function updateSky(dt){
  const target = phase === "dawn" ? 1 : 0;
  skyBlend += (target - skyBlend) * Math.min(1, dt*0.0016);

  const c = NIGHT_SKY.clone().lerp(DAWN_SKY, skyBlend);
  scene.background.copy(c);
  scene.fog.color.copy(c);
  scene.fog.near = 12 + skyBlend*26;
  scene.fog.far = 46 + skyBlend*60;

  ambient.intensity = .5 + skyBlend*.65;
  sunLight.intensity = .22 + skyBlend*.85;
  sunLight.color.setHex(skyBlend > .5 ? 0xffe0b0 : 0x9fb6e8);
}

function updateEnemies(dt, t){
  const speed = ENEMY_SPEED_BASE + (nightNumber-1)*ENEMY_SPEED_GROWTH;
  const safeR = fireRadius();

  if (wardTimer > 0) wardTimer -= dt;
  if (swingCooldown > 0){
    swingCooldown -= dt;
    if (swingCooldown <= 0) strikeBtn.classList.remove("cooling");
  }

  // light the button when something is actually in reach, so
  // you're not guessing at distance in the dark
  if (swingLive > 0) swingLive -= dt;

  let inRange = false;
  const myReach = SWORDS[swordTier].reach;
  for (const e of enemies){
    if (e.fleeing) continue;
    if (Math.hypot(player.x - e.x, player.z - e.z) < myReach){ inRange = true; break; }
  }
  strikeBtn.classList.toggle("ready", inRange && swingCooldown <= 0);

  // the swing itself — a quick arc, then back to rest
  if (swingTimer > 0){
    swingTimer -= dt;
    const p = 1 - Math.max(0, swingTimer) / SWING_TIME;   // 0 to 1 through the swing
    sword.rotation.x = REST_X - Math.sin(p * Math.PI) * 2.4;
    sword.rotation.z = REST_Z + Math.sin(p * Math.PI) * .6;
  } else {
    sword.rotation.x = REST_X;
    sword.rotation.z = REST_Z;
  }

  for (let i = enemies.length-1; i >= 0; i--){
    const e = enemies[i];
    const tx = player.x - e.x, tz = player.z - e.z;
    const distPlayer = Math.hypot(tx,tz) || 1;
    const distFire = Math.hypot(e.x, e.z);

    let dirX, dirZ;

    if (e.fleeing){
      const a = Math.atan2(e.z, e.x);
      dirX = Math.cos(a); dirZ = Math.sin(a);
      if (distFire > ARENA - 2){
        scene.remove(e.mesh);
        enemies.splice(i,1);
        continue;
      }
    } else if (wardTimer > 0 && distPlayer < 16){
      // the warding keeps them off you
      dirX = -tx/distPlayer; dirZ = -tz/distPlayer;
    } else if (distFire < safeR){
      const a = Math.atan2(e.z, e.x);
      dirX = Math.cos(a); dirZ = Math.sin(a);
    } else {
      dirX = tx/distPlayer; dirZ = tz/distPlayer;
    }

    const mult = e.fleeing ? 3.2 : 1;
    e.x += dirX * speed * mult * (dt/16.67);
    e.z += dirZ * speed * mult * (dt/16.67);

    e.mesh.position.set(e.x, Math.abs(Math.sin(t*.006 + e.bob))*.12, e.z);
    e.mesh.rotation.y = Math.atan2(dirX, dirZ);

    // walked into a swing that's still going
    if (swingLive > 0 && !e.fleeing && distPlayer < myReach){
      scene.remove(e.mesh);
      enemies.splice(i,1);
      kills++;
      coins += 1 + Math.floor((nightNumber-1)/2);
      updateHUD();
      continue;
    }

    if (!e.fleeing && distPlayer < 1.25 && player.hurtTimer <= 0){
      player.health--;
      player.hurtTimer = HURT_COOLDOWN;
      warn("hit!");
      updateHUD();
      if (player.health <= 0){ gameOver(); return; }
    }
  }
}

function updateSpawning(dt){
  if (phase === "dawn"){
    woodTimer += dt;
    if (woodTimer > 2600 && woodItems.length < 16){
      woodTimer = 0;
      spawnWood();
    }
    return;
  }

  const fireFactor = 1 - (fuel/FIRE_MAX)*0.55;
  const interval = Math.max(650, (4400 - nightNumber*280) * fireFactor);

  spawnTimer += dt;
  if (spawnTimer > interval && enemies.length < 26){
    spawnTimer = 0;
    spawnEnemy();
  }

  woodTimer += dt;
  if (woodTimer > 8000 && woodItems.length < 6){
    woodTimer = 0;
    spawnWood();
  }
}

const camTarget = new THREE.Vector3();
function updateCamera(){
  const dist=11, height=8.5;
  const wx = player.x - Math.sin(camAngle)*dist;
  const wz = player.z - Math.cos(camAngle)*dist;
  camera.position.x += (wx-camera.position.x)*.1;
  camera.position.y += (height-camera.position.y)*.1;
  camera.position.z += (wz-camera.position.z)*.1;
  camTarget.set(player.x, 1.2, player.z);
  camera.lookAt(camTarget);
}

  if (nightNumber > bestNight){ bestNight = nightNumber; decks[activeDeck].best = bestNight; saveDecks(); }

  document.getElementById("overtime").textContent = "survived " + formatTime(elapsed);

    "furthest: night " + bestNight + (kills > 0 ? "  ·  " + kills + " cut down" : "");

    rev.innerHTML = '<h3>nothing missed. clean run.</h3>';
  } else {

      html += '<div class="miss"><div class="mq">' + m.q + '</div>' +

// ---- the list of sets ----
function renderDecks(){
  const list = document.getElementById("decklist");
  if (!list) return;
  let html = "";
  for (let i = 0; i < decks.length; i++){
    const d = decks[i];
    const count = parseQuestions(d.text).length;
    html +=
      '<div class="deck' + (i === activeDeck ? ' on' : '') + '" data-pick="' + i + '">' +
        '<div class="dinfo">' +
          '<div class="dname">' + escapeHtml(d.name) + '</div>' +
          '<div class="dmeta">' + count + ' question' + (count===1?"":"s") +
            (d.best > 1 ? ' &middot; furthest night ' + d.best : '') + '</div>' +
        '</div>' +
        '<div class="dacts">' +
          '<button class="dbtn" data-edit="' + i + '">edit</button>' +
          (decks.length > 1 ? '<button class="dbtn" data-del="' + i + '">delete</button>' : '') +
        '</div>' +
      '</div>';
  }
  list.innerHTML = html;

  list.querySelectorAll("[data-pick]").forEach(el => {
    el.onclick = e => {
      // ignore taps that landed on the edit/delete buttons
      if (e.target.closest(".dbtn")) return;
      pickDeck(Number(el.dataset.pick));
    };
  });
  list.querySelectorAll("[data-edit]").forEach(b => {
    b.onclick = () => { editing = Number(b.dataset.edit); renderEditor(); };
  });
  list.querySelectorAll("[data-del]").forEach(b => {
    b.onclick = () => {
      const i = Number(b.dataset.del);
      decks.splice(i, 1);
      if (activeDeck >= decks.length) activeDeck = decks.length - 1;
      else if (activeDeck > i) activeDeck--;
      editing = null;
      pickDeck(activeDeck);
    };
  });
}

function pickDeck(i){
  activeDeck = i;
  if (!loadQuestions(decks[i].text)) loadQuestions(SAMPLE_TEXT);
  bestNight = decks[i].best || 1;
  saveDecks();
  buildMenu();
}

// ---- the paste-and-name editor ----
function renderEditor(){
  const box = document.getElementById("editor");
  if (!box) return;
  if (editing === null){ box.innerHTML = ""; return; }

  const isNew = editing === -1;
  const d = isNew ? { name: "", text: "" } : decks[editing];

  box.innerHTML =
    '<p>One question per block, a blank line between them, ' +
    'and a * in front of the right answer.</p>' +
    '<input id="deckname" placeholder="name it — Biology, Unit 4..." value="' +
      escapeHtml(d.name) + '">' +
    '<textarea id="qinput" placeholder="What is 2 + 2?&#10;*4&#10;3&#10;5">' +
      escapeHtml(d.text) + '</textarea>' +
    '<div class="btnrow">' +
      '<button class="btn" id="savedeck">' + (isNew ? "create set" : "save changes") + '</button>' +
      '<button class="btn ghost" id="canceledit">cancel</button>' +
      '<button class="btn ghost" id="sampledeck">sample format</button>' +
    '</div><div id="loadmsg"></div>';

  document.getElementById("canceledit").onclick = () => { editing = null; renderEditor(); };
  document.getElementById("sampledeck").onclick = () => {
    document.getElementById("qinput").value = SAMPLE_TEXT;
  };
  document.getElementById("savedeck").onclick = () => {
    const text = document.getElementById("qinput").value;
    const name = document.getElementById("deckname").value.trim();
    const msg = document.getElementById("loadmsg");
    const n = parseQuestions(text).length;

    if (n === 0){
      msg.style.color = "#ff9a8a";
      msg.textContent = "couldn't read that — each question needs a * on one answer";
      return;
    }
    if (isNew){
      decks.push({ name: name || "Set " + (decks.length + 1), text: text, best: 1 });
      activeDeck = decks.length - 1;
    } else {
      decks[editing].name = name || decks[editing].name || "Set " + (editing + 1);
      decks[editing].text = text;
      activeDeck = editing;
    }
    editing = null;
    pickDeck(activeDeck);
  };
}

// turns < > & " into safe text so a question can't break the page
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}

document.getElementById("again").onclick = startGame;
document.getElementById("tomenu").onclick = showMenu;


// =====================================================
//  MAIN LOOP
// =====================================================
function animate(t){
  t = t || 0;
  const now = performance.now();
  let dt = now - lastFrame;
  lastFrame = now;
  if (dt > 100) dt = 100;

  if (playing){
    updateSky(dt);
    updateSafeRing(t);

    if (studying){
      updateFire(dt, t);
      if (phase === "dawn"){
        dawnTimer -= dt;
        if (dawnTimer <= 0) startNight();
      }
      updateHUD();
    } else {
      elapsed += dt;
      updatePlayer(dt);
      updateWood();
      updateFire(dt, t);
      updateEnemies(dt, t);
      updateWizard(dt, t);
      updateSpawning(dt);

      if (phase === "dawn"){
        dawnTimer -= dt;
        if (dawnTimer <= 0) startNight();
      }

      updateHUD();

      if (warnTimer > 0){
        warnTimer -= dt;
        if (warnTimer <= 0) document.getElementById("warn").style.opacity = 0;
      }
      if (bannerTimer > 0){
        bannerTimer -= dt;
        if (bannerTimer <= 0) document.getElementById("banner").style.opacity = 0;
      }
    }
    updateCamera();
  }

  flame.rotation.y += .05;
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

showMenu();
animate(0);


// =====================================================
//  APP INSTALL + AUTO-UPDATE
//
//  The service worker checks for a new version whenever
//  the app opens or comes back to the foreground. When
//  one shows up we swap to it immediately if the player
//  is on the menu, or offer a banner if they're mid-run
//  so we don't yank a game out from under them.
// =====================================================
let swReg = null;
let updateReady = false;

if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      swReg = reg;

      // a new version finished downloading
      reg.addEventListener("updatefound", () => {
        const fresh = reg.installing;
        if (!fresh) return;
        fresh.addEventListener("statechange", () => {
          if (fresh.state === "installed" && navigator.serviceWorker.controller) {
            updateReady = true;
            handleUpdateReady();
          }
        });
      });

      checkForUpdate();
    }).catch(err => console.log("service worker failed:", err));

    // when the new worker takes over, reload once to run the new code
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
  });
}

function checkForUpdate(){
  if (swReg) swReg.update().catch(() => {});
}

// check again every time the app comes back to the front,
// and every two minutes while it's open
addEventListener("visibilitychange", () => {
  if (!document.hidden) checkForUpdate();
});
setInterval(checkForUpdate, 120000);

function applyUpdate(){
  if (swReg && swReg.waiting) swReg.waiting.postMessage("SKIP_WAITING");
  else location.reload();
}

function handleUpdateReady(){
  // not mid-run? just take it silently
  if (!playing) { applyUpdate(); return; }

  if (document.getElementById("updbar")) return;
  const bar = document.createElement("div");
  bar.id = "updbar";
  bar.textContent = "new version ready — tap to update";
  bar.style.cssText =
    "position:fixed;bottom:0;left:0;right:0;z-index:40;padding:13px;" +
    "text-align:center;font-size:14px;font-weight:bold;color:#2b1a0c;" +
    "background:#ffd166;font-family:'Trebuchet MS',sans-serif;";
  bar.onclick = applyUpdate;
  document.body.appendChild(bar);
}


// ---- the install prompt (Android / Chrome) ----
let installPrompt = null;

addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  showInstallButton();
});

function showInstallButton(){
  if (!installPrompt) return;
  if (document.getElementById("installbtn")) return;

  const menu = document.getElementById("menu");
  if (!menu || menu.style.display === "none") return;

  const btn = document.createElement("button");
  btn.id = "installbtn";
  btn.textContent = "install as an app";
  btn.style.cssText =
    "display:block;width:100%;padding:14px;margin-top:12px;font-size:15px;" +
    "font-weight:bold;border:2px solid rgba(255,157,77,.7);border-radius:28px;" +
    "background:rgba(255,157,77,.14);color:#fff;";
  btn.onclick = async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    const choice = await installPrompt.userChoice;
    if (choice.outcome === "accepted") btn.remove();
    installPrompt = null;
  };
  menu.appendChild(btn);
}

// the menu gets rebuilt a lot, so re-add the button after each rebuild
const _buildMenu = buildMenu;
buildMenu = function(){
  _buildMenu();
  showInstallButton();
};
